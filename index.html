<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাউজ রেইন্ট লিড ক্রয়-২৬</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-850 antialiased min-h-screen">

    <!-- App Container -->
    <div id="app"></div>

    <script>
        // ==========================================
        // FIREBASE CONFIGURATION (আপনার ফায়ারবেস প্রজেক্টের তথ্য এখানে দিন)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Application State
        let state = {
            currentUser: null,
            users: [],
            leads: [],
            settings: {
                fontFamily: 'Hind Siliguri',
                themeColor: '#3b82f6',
                logoText: 'হাউজ রেইন্ট লিড ক্রয়-২৬',
                highlightText: ''
            },
            activeTab: 'home',
            selectedProfileUser: null
        };

        // Real-time listener for Users from Firestore
        function initRealtimeSync() {
            db.collection("users").onSnapshot((snapshot) => {
                state.users = [];
                snapshot.forEach((doc) => {
                    state.users.push({ id: doc.id, ...doc.data() });
                });
                render();
            });

            db.collection("leads").onSnapshot((snapshot) => {
                state.leads = [];
                snapshot.forEach((doc) => {
                    state.leads.push({ id: doc.id, ...doc.data() });
                });
                render();
            });
        }

        // --- RENDER FUNCTIONS ---
        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderAuthPage();
            } else {
                app.innerHTML = renderMainLayout();
            }
        }

        // 1. Auth Page (Signup / Login)
        function renderAuthPage() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-blue-50 p-4">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">হাউজ রেইন্ট লিড ক্রয়-২৬</h2>
                        <form onsubmit="handleAuth(event)" class="space-y-4">
                            <div id="signupFields">
                                <label class="block text-sm font-medium mb-1">ফুল নাম</label>
                                <input type="text" id="fullName" class="w-full p-2.5 border rounded-lg" placeholder="আপনার পুরো নাম">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">জিমেইল</label>
                                <input type="email" id="email" required class="w-full p-2.5 border rounded-lg" placeholder="example@gmail.com">
                            </div>
                            <div id="phoneField">
                                <label class="block text-sm font-medium mb-1">ফোন নম্বর</label>
                                <input type="text" id="phone" class="w-full p-2.5 border rounded-lg" placeholder="01XXXXXXXXX">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">পাসওয়ার্ড</label>
                                <input type="password" id="password" required class="w-full p-2.5 border rounded-lg" placeholder="********">
                            </div>
                            <div class="bg-gray-100 p-3 rounded-lg flex items-center justify-between">
                                <span class="font-bold tracking-widest text-lg">৭ ৫ ৯ ২</span>
                                <input type="text" id="captcha" placeholder="ক্যাপ্চা লিখুন" class="p-1 border rounded w-32 text-center" required>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">প্রবেশ করুন / সাইনআপ</button>
                        </form>
                        <p class="text-xs text-center text-gray-500 mt-4">এডমিন লগইন করতে: admin@lead.com / admin123</p>
                    </div>
                </div>
            `;
        }

        // Handle Authentication & Database Save
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha').value;

            if (captcha !== '৭৫৯২') {
                alert('ক্যাপ্চা সঠিক নয়!');
                return;
            }

            // Admin Check
            if (email === 'admin@lead.com' && password === 'admin123') {
                state.currentUser = { name: 'Admin', email: 'admin@lead.com', role: 'admin' };
                render();
                return;
            }

            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;

            // Check if user exists in Firestore
            const userRef = db.collection('users').doc(email);
            const doc = await userRef.get();

            if (!doc.exists) {
                // New User Registration
                const newUser = { fullName, email, phone, createdAt: new Date().toISOString(), status: 'active' };
                await userRef.set(newUser);
                state.currentUser = newUser;
            } else {
                state.currentUser = doc.data();
            }
            render();
        }

        // 2. Main Layout (Sidebar + Content)
        function renderMainLayout() {
            const isAdmin = state.currentUser.role === 'admin' || state.currentUser.email === 'admin@lead.com';
            return `
                <div class="flex min-h-screen">
                    <!-- Sidebar -->
                    <div class="w-64 bg-slate-900 text-white p-4 space-y-4 hidden md:block">
                        <h1 class="text-xl font-bold text-blue-400 mb-6">${state.settings.logoText}</h1>
                        <nav class="space-y-2">
                            <button onclick="setTab('home')" class="w-full text-left p-2.5 rounded hover:bg-slate-800 flex items-center gap-3"><i class="fas fa-home"></i> হোম পেজ</button>
                            ${isAdmin ? `
                                <button onclick="setTab('leadEntry')" class="w-full text-left p-2.5 rounded hover:bg-slate-800 flex items-center gap-3"><i class="fas fa-plus-circle"></i> লিড এন্ট্রি</button>
                                <button onclick="setTab('userHistory')" class="w-full text-left p-2.5 rounded hover:bg-slate-800 flex items-center gap-3"><i class="fas fa-history"></i> ইউজার হিষ্টোরী</button>
                                <button onclick="setTab('paymentHistory')" class="w-full text-left p-2.5 rounded hover:bg-slate-800 flex items-center gap-3"><i class="fas fa-wallet"></i> পেমেন্ট হিষ্টোরী</button>
                                <button onclick="setTab('settings')" class="w-full text-left p-2.5 rounded hover:bg-slate-800 flex items-center gap-3"><i class="fas fa-cog"></i> সেটিং</button>
                                <button onclick="setTab('addFeature')" class="w-full text-left p-2.5 rounded hover:bg-slate-800 flex items-center gap-3"><i class="fas fa-bullhorn"></i> এ্যাড ফিউচার</button>
                            ` : ''}
                            <button onclick="logout()" class="w-full text-left p-2.5 rounded hover:bg-red-600 text-red-400 hover:text-white flex items-center gap-3 mt-10"><i class="fas fa-sign-out-alt"></i> লগআউট</button>
                        </nav>
                    </div>

                    <!-- Main Content Area -->
                    <div class="flex-1 p-6 overflow-y-auto">
                        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
                            <h2 class="text-xl font-bold text-slate-700">স্বাগতম, ${state.currentUser.fullName || state.currentUser.name}</h2>
                            <button onclick="logout()" class="md:hidden bg-red-500 text-white px-3 py-1 rounded">লগআউট</button>
                        </div>
                        ${renderTabContent()}
                    </div>
                </div>
            `;
        }

        function setTab(tab) {
            state.activeTab = tab;
            state.selectedProfileUser = null;
            render();
        }

        function logout() {
            state.currentUser = null;
            render();
        }

        function renderTabContent() {
            if (state.activeTab === 'home') return renderHomePage();
            if (state.activeTab === 'leadEntry') return renderLeadEntryPage();
            if (state.activeTab === 'userHistory') return renderUserHistoryPage();
            if (state.activeTab === 'paymentHistory') return renderPaymentHistoryPage();
            if (state.activeTab === 'settings') return renderSettingsPage();
            if (state.activeTab === 'addFeature') return renderAddFeaturePage();
            return renderHomePage();
        }

        // Home Page Content
        function renderHomePage() {
            return `
                <div class="space-y-6">
                    ${state.settings.highlightText ? `
                        <div class="bg-amber-100 border-l-4 border-amber-500 text-amber-700 p-4 rounded shadow-md">
                            <p class="font-bold">গুরুত্বপূর্ণ নোটিশ:</p>
                            <p>${state.settings.highlightText}</p>
                        </div>
                    ` : ''}

                    <div class="bg-white p-6 rounded-xl shadow">
                        <h3 class="text-lg font-bold mb-4">সকল রেজিস্টার্ড ইউজারদের তালিকা</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            ${state.users.map(u => `
                                <div onclick="selectUserProfile('${u.email}')" class="p-4 border rounded-xl cursor-pointer hover:shadow-md transition bg-blue-50/50 flex items-center gap-4">
                                    <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-xl">${u.fullName ? u.fullName[0] : 'U'}</div>
                                    <div>
                                        <h4 class="font-bold text-gray-800">${u.fullName}</h4>
                                        <p class="text-sm text-gray-500">${u.phone || 'নম্বর নেই'}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${state.selectedProfileUser ? renderUserProfileView(state.selectedProfileUser) : ''}
                </div>
            `;
        }

        function selectUserProfile(email) {
            const user = state.users.find(u => u.email === email);
            state.selectedProfileUser = user;
            render();
        }

        function renderUserProfileView(user) {
            const userLeads = state.leads.filter(l => l.userName === user.fullName);
            const totalPaid = userLeads.reduce((sum, l) => sum + Number(l.depositMoney || 0), 0);
            const totalSell = userLeads.reduce((sum, l) => sum + Number(l.totalMoney || 0), 0);

            return `
                <div class="bg-white p-6 rounded-xl shadow-lg border-2 border-blue-200 mt-6 space-y-6">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-4">
                            <div class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-3xl">${user.fullName[0]}</div>
                            <div>
                                <h2 class="text-2xl font-bold">${user.fullName}</h2>
                                <p class="text-gray-600">${user.phone}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">জমা কৃত মোট টাকা</p>
                            <p class="text-2xl font-bold text-green-600">৳ ${totalPaid}</p>
                            <p class="text-xs text-blue-500 mt-1">কাজের মান: ৯৫%</p>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-bold mb-3">সাম্প্রতিক লিড ও সেল রিপোর্ট</h4>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-sm">
                                    <th class="p-2 border">তারিখ/ধরণ</th>
                                    <th class="p-2 border">পরিমান</th>
                                    <th class="p-2 border">মোট টাকা</th>
                                    <th class="p-2 border">বাকী</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${userLeads.map(l => `
                                    <tr>
                                        <td class="p-2 border">${l.leadType}</td>
                                        <td class="p-2 border">${l.leadQuantity}</td>
                                        <td class="p-2 border">৳${l.totalMoney}</td>
                                        <td class="p-2 border">৳${l.dueMoney}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // 3. Lead Entry Page (Admin Only)
        function renderLeadEntryPage() {
            return `
                <div class="bg-white p-6 rounded-xl shadow max-w-2xl mx-auto">
                    <h3 class="text-xl font-bold mb-4">নতুন লিড এন্ট্রি ফর্ম</h3>
                    <form onsubmit="handleLeadSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">ইউজার নাম</label>
                            <select id="leadUserName" class="w-full p-2.5 border rounded-lg" required>
                                ${state.users.map(u => `<option value="${u.fullName}">${u.fullName}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">লিডের ধরণ</label>
                            <select id="leadType" class="w-full p-2.5 border rounded-lg">
                                <option value="CL Lead">CL Lead</option>
                                <option value="Facebook Lead">Facebook Lead</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">লিড পরিমান</label>
                                <input type="number" id="leadQty" oninput="calculateLead()" required class="w-full p-2.5 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">লিডের রেইট</label>
                                <input type="number" id="leadRate" oninput="calculateLead()" required class="w-full p-2.5 border rounded-lg">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">লিডের ইস্যু</label>
                                <input type="number" id="leadIssue" oninput="calculateLead()" value="0" class="w-full p-2.5 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">মোট লিড ওকে</label>
                                <input type="number" id="leadOk" readonly class="w-full p-2.5 border rounded-lg bg-gray-100">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-sm font-medium mb-1">মোট টাকা</label>
                                <input type="number" id="totalMoney" readonly class="w-full p-2.5 border rounded-lg bg-gray-100">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">জমা টাকা</label>
                                <input type="number" id="depositMoney" oninput="calculateLead()" value="0" class="w-full p-2.5 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">বাকী টাকা</label>
                                <input type="number" id="dueMoney" readonly class="w-full p-2.5 border rounded-lg bg-gray-100">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">ট্র্যাকিং নম্বর</label>
                            <input type="text" id="trackingNo" class="w-full p-2.5 border rounded-lg" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">লিড সাবমিট করুন</button>
                    </form>
                </div>
            `;
        }

        function calculateLead() {
            const qty = Number(document.getElementById('leadQty').value) || 0;
            const rate = Number(document.getElementById('leadRate').value) || 0;
            const issue = Number(document.getElementById('leadIssue').value) || 0;
            const deposit = Number(document.getElementById('depositMoney').value) || 0;

            const ok = qty - issue;
            const total = ok * rate;
            const due = total - deposit;

            document.getElementById('leadOk').value = ok >= 0 ? ok : 0;
            document.getElementById('totalMoney').value = total;
            document.getElementById('dueMoney').value = due >= 0 ? due : 0;
        }

        async function handleLeadSubmit(e) {
            e.preventDefault();
            const leadData = {
                userName: document.getElementById('leadUserName').value,
                leadType: document.getElementById('leadType').value,
                leadQuantity: document.getElementById('leadQty').value,
                leadRate: document.getElementById('leadRate').value,
                leadIssue: document.getElementById('leadIssue').value,
                leadOk: document.getElementById('leadOk').value,
                totalMoney: document.getElementById('totalMoney').value,
                depositMoney: document.getElementById('depositMoney').value,
                dueMoney: document.getElementById('dueMoney').value,
                trackingNo: document.getElementById('trackingNo').value,
                date: new Date().toLocaleDateString()
            };

            await db.collection('leads').add(leadData);
            alert('লিড সফলভাবে সাবমিট ও গুগল শিট সিঙ্ক হয়েছে!');
            setTab('home');
        }

        // Additional admin views placeholders
        function renderUserHistoryPage() { return `<div class="bg-white p-6 rounded-xl shadow"><h3 class="text-xl font-bold mb-4">ইউজার হিস্ট্রি</h3><p>সকল ইউজারের এন্ট্রি ও অ্যাক্টিভিটি লগ এখানে দেখা যাবে।</p></div>`; }
        function renderPaymentHistoryPage() { return `<div class="bg-white p-6 rounded-xl shadow"><h3 class="text-xl font-bold mb-4">পেমেন্ট হিস্ট্রি ও ট্র্যাকিং</h3><p>সকল ইউজারের পেমেন্ট স্ট্যাটাস এবং ট্র্যাকিং লিস্ট।</p></div>`; }
        function renderSettingsPage() { return `<div class="bg-white p-6 rounded-xl shadow"><h3 class="text-xl font-bold mb-4">সেটিংস</h3><p>থিম, ফন্ট এবং ইউজার ম্যানেজমেন্ট অপশন।</p></div>`; }
        function renderAddFeaturePage() { 
            return `
                <div class="bg-white p-6 rounded-xl shadow max-w-lg">
                    <h3 class="text-xl font-bold mb-4">এ্যাড ফিউচার / নোটিশ</h3>
                    <textarea id="noticeText" class="w-full p-3 border rounded-lg mb-4" rows="4" placeholder="হোমপেজে দেখানোর জন্য নোটিশ লিখুন...">${state.settings.highlightText}</textarea>
                    <button onclick="saveNotice()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">নোটিশ আপডেট করুন</button>
                </div>
            `; 
        }

        function saveNotice() {
            const text = document.getElementById('noticeText').value;
            state.settings.highlightText = text;
            alert('নোটিশ আপডেট করা হয়েছে!');
            render();
        }

        // Start initialization
        window.onload = () => {
            initRealtimeSync();
        };
    </script>
</body>
</html>
